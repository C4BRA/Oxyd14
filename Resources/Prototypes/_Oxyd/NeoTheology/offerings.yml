# P3.8: Eris /datum/ritual/offering, ported as data. The priest names an offering;
# the altar collects matching items on its turf and the Eye converts them to observation.
#
# holy_guidance takes one oddity (any OxydOddityBase child) plus the fruit.

- type: oxydOffering
  id: OxydNtOfferingDivineIntervention
  name: oxyd-offering-divine-intervention
  required:
  - proto: OxydNtBiomatter
    count: 200
  # ponytail: one full miracle's worth (1000 observation) per 200 biomatter — a flagged
  # balance choice; Eris grants the same intervention directly rather than banking it.
  observation: 1000

- type: oxydOffering
  id: OxydNtOfferingHolyGuidance
  name: oxyd-offering-holy-guidance
  required:
  # Eris: 1 oddity + 40 grown fruits (/obj/item/reagent_containers/food/snacks/grown).
  # Produce has no single ancestor prototype in this fork (ProduceBase grains vs
  # FoodProduceBase edibles), so the requirement names the edible half.
  - proto: FoodProduceBase
    count: 40
  - proto: OxydOddityBase
    count: 1
  # ponytail: half a miracle's worth (500 observation) for 40 produce — a flagged balance
  # choice; Eris hands these offerings one of five miracle outcomes directly.
  observation: 500
