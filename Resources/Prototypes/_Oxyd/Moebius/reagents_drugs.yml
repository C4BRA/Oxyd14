# Eris recreational drugs and toxins used by Moebius (code/modules/reagents/reagents/drugs.dm).
# Space drugs, nicotine and cryptobiolin exist natively — these are the Eris-unique entries.

- type: reagent
  id: OxydDrugSerotrotium
  name: oxyd-reagent-serotrotium
  desc: oxyd-reagent-serotrotium-desc
  group: Drugs
  physicalDesc: reagent-physical-desc-opaque
  flavor: medicine
  color: "#AAAA77"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.02
      effects:
      - !type:Emote
        emote: Laugh
      - !type:Drunk
      - !type:Nsa
        value: 2
      - !type:Addictive
        reagent: OxydDrugSerotrotium
        threshold: 20
        addictionChance: 0.15

