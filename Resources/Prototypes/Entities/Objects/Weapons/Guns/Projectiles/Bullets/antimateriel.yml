- type: entity
  parent: BaseBullet
  id: BulletAntiMateriel
  categories: [ HideSpawnMenu ]
  name: bullet (.60 anti-materiel)
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 75
        Structural: 100
    penetrationThreshold: 601
    penetrationDamageTypeRequirement:
    - Structural
  # Extrapolated from the .50 anti-materiel class; penetration still resolves first.
  - type: PhysicalRicochetProjectile
    maxBounces: 1
    normalRetention: 0.45
    tangentialRetention: 0.85
    damageRetention: 0.6
    spread: 4
    fragmentMaxRatio: 0.5
    fragmentProto: BulletFragment
    minFragments: 2
    maxFragments: 4
    fragmentCone: 20
    fragmentSpeedFraction: 0.5
    fragmentDamageFraction: 0.25
    fragmentOnEmbed: true
  - type: StaminaDamageOnCollide
    damage: 60
